                Properties:
                  Text: =ThisItem.I
                  Size: =12
                  Align: =Align.Center
                  Fill: =RGBA(232, 245, 233, 1)
                  OnSelect: =Select(Parent)
                  X: =392
                  Y: =0
                  Width: =52
                  Height: =Parent.TemplateHeight
            - lblPR:
