            Text: =Text(Sum(colContDia, Insucessos), "#,##0", "pt-BR")
            Fill: =Color.White
            Color: =LookUp(Categorias, Cod = "INSUCESSO").Cor
            Size: =26
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =177
            Y: =200
            Width: =137
            Height: =70
      - lblKpiICap:
