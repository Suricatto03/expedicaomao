            Width: =139
            Height: =30

      # ------------------------------------------------------------ KPIs (linha 2)
      - lblKpiTot:
          Control: Label@2.5.1
          Properties:
            Text: =Text(Sum(colContDia, Total), "#,##0", "pt-BR")
            Fill: =CorPrimaria
            Color: =Color.White
            Size: =26
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =30
            Y: =310
            Width: =137
            Height: =70
      - lblKpiTotCap:
          Control: Label@2.5.1
          Properties:
            Text: ="Total p/ expedir"
            Fill: =CorPrimaria
            Color: =Color.White
            Size: =11
            Align: =Align.Center
            X: =30
            Y: =380
            Width: =137
            Height: =30
      - lblKpiDisp:
          Control: Label@2.5.1
          Properties:
            Text: =If(IsBlank(varResumo), "—", Text(varResumo.Disponiveis, "#,##0", "pt-BR"))
            Fill: =Color.White
            Color: =CorEscura
            Size: =26
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =177
            Y: =310
            Width: =137
            Height: =70
      - lblKpiDispCap:
          Control: Label@2.5.1
          Properties:
            Text: ="Disponíveis"
            Fill: =Color.White
            Size: =11
            Align: =Align.Center
            X: =177
            Y: =380
            Width: =137
            Height: =30
      - lblKpiPct:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(
                  Coalesce(varResumo.Disponiveis, 0) > 0,
                  Text(Sum(colContDia, Faturadas) / varResumo.Disponiveis, "0%"),
                  "—"
              )
            Fill: =Color.White
            Color: =CorEscura
            Size: =26
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =324
            Y: =310
            Width: =137
            Height: =70
      - lblKpiPctCap:
          Control: Label@2.5.1
          Properties:
            Text: ="% Faturamento"
            Fill: =Color.White
            Size: =11
            Align: =Align.Center
            X: =324
            Y: =380
            Width: =137
            Height: =30
      - lblKpiAnt:
          Control: Label@2.5.1
          Properties:
            Text: =Text(Sum(colContDia, Insucessos) + Sum(colContDia, Resgates), "#,##0", "pt-BR")
            Fill: =Color.White
            Color: =RGBA(198, 40, 40, 1)
            Size: =26
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =471
            Y: =310
            Width: =139
            Height: =70
      - lblKpiAntCap:
          Control: Label@2.5.1
          Properties:
            Text: ="Total antigas"
            Fill: =Color.White
            Size: =11
            Align: =Align.Center
            X: =471
            Y: =380
            Width: =139
            Height: =30

