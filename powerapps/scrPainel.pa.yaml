      - galPainel:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =ForAll(
                  colItinerarios As it,
                  With(
                      {c: LookUp(colContDia, Ordem = it.Ordem)},
                      {
                          Ordem: it.Ordem,
                          Doca: it.Doca,
                          Itinerario: it.Itinerario,
                          Bairros: it.Bairros,
                          Codigo: it.CodigoItinerario,
                          Matricula: it.Matricula,
                          F: Coalesce(c.Faturadas, 0),
                          I: Coalesce(c.Insucessos, 0),
                          R: Coalesce(c.Resgates, 0),
                          M: Coalesce(c.MP, 0),
                          T: Coalesce(c.Total, 0)
                      }
                  )
              )
            TemplateSize: =50
            TemplatePadding: =0
            Fill: =Color.White
            OnSelect: |-
              =Set(varLinhaDet, ThisItem);
              Set(varDetDataRef, Text(dpData.SelectedDate, "yyyy-mm-dd"));
              Navigate(scrDetalhe, ScreenTransition.None)
            X: =10
            Y: =465
            Width: =620
            Height: =620
          Children:
            - lblPDoca:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Doca
                  FontWeight: =FontWeight.Bold
                  Size: =12
                  Fill: =CorPrimaria
                  Color: =Color.White
                  Align: =Align.Center
                  OnSelect: =Select(Parent)
                  X: =0
                  Y: =2
                  Width: =52
                  Height: =Parent.TemplateHeight - 4
            - lblPIt:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Itinerario
                  Size: =11
                  Align: =Align.Center
                  OnSelect: =Select(Parent)
                  X: =54
                  Y: =0
                  Width: =56
                  Height: =Parent.TemplateHeight
            - lblPBairro:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Bairros
                  Size: =9
                  OnSelect: =Select(Parent)
                  X: =112
                  Y: =0
                  Width: =228
                  Height: =Parent.TemplateHeight
            - lblPF:
