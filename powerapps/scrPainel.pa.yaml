Screens:
  scrPainel:
    Properties:
      Fill: =CorFundo
      OnVisible: =Select(btnAtualizar)
    Children:
      - rectHeaderPai:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =CorPrimaria
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =110
      - icoVoltarPai:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            Color: =Color.White
            OnSelect: =Navigate(scrInicio, ScreenTransition.None)
            X: =15
            Y: =25
            Width: =60
            Height: =60
      - lblTituloPai:
          Control: Label@2.5.1
          Properties:
            Text: ="Painel do Dia"
            Color: =Color.White
            Size: =22
            FontWeight: =FontWeight.Bold
            X: =85
            Y: =12
            Width: =540
            Height: =50
      - lblAtualizadoPai:
          Control: Label@2.5.1
          Properties:
            Text: ="Atualizado às " & Text(varAtualizadoEm, "hh:mm:ss")
            Color: =Color.White
            Size: =12
            X: =85
            Y: =60
            Width: =540
            Height: =35

      # ------------------------------------------------------------ Filtro de data
      - dpData:
          Control: Classic/DatePicker@2.6.0
          Properties:
            DefaultDate: =Today()
            Format: ="dd/mm/yyyy"
            OnChange: =Select(btnAtualizar)
            Size: =15
            X: =30
            Y: =125
            Width: =330
            Height: =60
      - btnAtualizar:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="ATUALIZAR"
            Fill: =CorEscura
            Color: =Color.White
            Size: =15
            FontWeight: =FontWeight.Bold
            X: =375
            Y: =125
            Width: =235
            Height: =60
            OnSelect: |-
              =With(
                  {d: Text(dpData.SelectedDate, "yyyy-mm-dd")},
                  ClearCollect(colContDia, Filter(ContagemDiaria, DataRef = d));
                  Set(varResumo, LookUp(ResumoDiario, Title = d))
              );
              Set(varAtualizadoEm, Now())
      - tmrAtualizar:
          Control: Timer@2.1.0
          Properties:
            Duration: =60000
            Repeat: =true
            AutoStart: =true
            Visible: =false
            OnTimerEnd: =Select(btnAtualizar)
            X: =0
            Y: =0
            Width: =10
            Height: =10

      # ------------------------------------------------------------ KPIs (linha 1)
      - lblKpiF:
          Control: Label@2.5.1
          Properties:
            Text: =Text(Sum(colContDia, Faturadas), "#,##0", "pt-BR")
            Fill: =Color.White
            Color: =LookUp(Categorias, Cod = "FATURADA").Cor
            Size: =26
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =30
            Y: =200
            Width: =137
            Height: =70
      - lblKpiFCap:
          Control: Label@2.5.1
          Properties:
            Text: ="Faturadas"
            Fill: =Color.White
            Size: =11
            Align: =Align.Center
            X: =30
            Y: =270
            Width: =137
            Height: =30
      - lblKpiI:
          Control: Label@2.5.1
