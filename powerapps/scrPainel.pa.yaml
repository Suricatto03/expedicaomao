                Properties:
                  Text: =ThisItem.F
                  Size: =12
                  Align: =Align.Center
                  OnSelect: =Select(Parent)
                  X: =340
                  Y: =0
                  Width: =52
                  Height: =Parent.TemplateHeight
            - lblPI:
