          Properties:
            Text: ="Insucessos"
            Fill: =Color.White
            Size: =11
            Align: =Align.Center
            X: =177
            Y: =270
            Width: =137
            Height: =30
      - lblKpiR:
          Control: Label@2.5.1
          Properties:
            Text: =Text(Sum(colContDia, Resgates), "#,##0", "pt-BR")
            Fill: =Color.White
            Color: =LookUp(Categorias, Cod = "RESGATE").Cor
            Size: =26
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =324
            Y: =200
            Width: =137
            Height: =70
      - lblKpiRCap:
