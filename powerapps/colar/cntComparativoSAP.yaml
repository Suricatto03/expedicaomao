# Bloco "COMPARATIVO BIPAGEM × SAP" para a tela scrPainelDia.
# Colar: selecione a tela (ou o contêiner rolável do painel) > botão direito > Colar.
# ÚNICO ajuste: em lblCompData.Text, troque Today() pela data que o painel usa
# (ex.: dpPainel.SelectedDate ou a sua variável de data). Todo o resto lê dali.
- cntComparativoSAP:
    Control: GroupContainer@1.3.0
    Variant: ManualLayout
    Properties:
      Fill: =Color.White
      BorderColor: =RGBA(220, 226, 235, 1)
      BorderThickness: =1
      Width: =Parent.Width - 24
      Height: =196
      X: =12
      Y: =0
    Children:
      - lblCompData:
          Control: Label@2.5.1
          Properties:
            Text: =Text(Today(), "yyyy-mm-dd")
            Visible: =false
            Width: =10
            Height: =10
      - lblCompTitulo:
          Control: Label@2.5.1
          Properties:
            Text: ="COMPARATIVO BIPAGEM × SAP"
            Fill: =RGBA(30, 90, 165, 1)
            Color: =Color.White
            FontWeight: =FontWeight.Bold
            Size: =12
            PaddingLeft: =10
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =34
      # números do dia: bipagem (ContagemDiaria) e SAP (IndicadoresSAP.Dados, JSON do fluxo)
      - lblCompBip:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =Text(
                  Sum(Filter(ContagemDiaria, DataRef = lblCompData.Text), Faturadas + Insucessos + Resgates + MP),
                  "#,##0", "pt-BR"
              )
            Color: =RGBA(28, 43, 77, 1)
            Size: =22
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =0
            Y: =40
            Width: =Parent.Width / 4
            Height: =44
      - lblCompZeu:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {j: ParseJSON(LookUp(IndicadoresSAP, Title = lblCompData.Text).Dados)},
                  If(IsBlank(j), "—", Text(Value(j.ordensZeu), "#,##0", "pt-BR"))
              )
            Color: =RGBA(28, 43, 77, 1)
            Size: =22
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =Parent.Width / 4
            Y: =40
            Width: =Parent.Width / 4
            Height: =44
      - lblCompVbap:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {j: ParseJSON(LookUp(IndicadoresSAP, Title = lblCompData.Text).Dados)},
                  If(IsBlank(j), "—", Text(Value(j.ordensVbap), "#,##0", "pt-BR"))
              )
            Color: =RGBA(28, 43, 77, 1)
            Size: =22
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =Parent.Width / 2
            Y: =40
            Width: =Parent.Width / 4
            Height: =44
      - lblCompSemVbap:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {j: ParseJSON(LookUp(IndicadoresSAP, Title = lblCompData.Text).Dados)},
                  If(IsBlank(j), "—", Text(Value(j.zeuSemVbap), "#,##0", "pt-BR"))
              )
            Color: =If(Value(Substitute(Self.Text, ".", "")) > 0, RGBA(211, 47, 47, 1), RGBA(28, 43, 77, 1))
            Size: =22
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =Parent.Width * 3 / 4
            Y: =40
            Width: =Parent.Width / 4
            Height: =44
      # legendas
      - lblCompCap1:
          Control: Label@2.5.1
          Properties:
            Text: ="Notas bipadas" & Char(10) & "(F+I+R+MP)"
            Size: =9
            Color: =RGBA(120, 130, 143, 1)
            Align: =Align.Center
            X: =0
            Y: =84
            Width: =Parent.Width / 4
            Height: =36
      - lblCompCap2:
          Control: Label@2.5.1
          Properties:
            Text: ="Ordens na" & Char(10) & "ZEUENTREGO"
            Size: =9
            Color: =RGBA(120, 130, 143, 1)
            Align: =Align.Center
            X: =Parent.Width / 4
            Y: =84
            Width: =Parent.Width / 4
            Height: =36
      - lblCompCap3:
          Control: Label@2.5.1
          Properties:
            Text: ="Ordens na" & Char(10) & "VBAP"
            Size: =9
            Color: =RGBA(120, 130, 143, 1)
            Align: =Align.Center
            X: =Parent.Width / 2
            Y: =84
            Width: =Parent.Width / 4
            Height: =36
      - lblCompCap4:
          Control: Label@2.5.1
          Properties:
            Text: ="ZEUENTREGO" & Char(10) & "sem VBAP"
            Size: =9
            Color: =RGBA(120, 130, 143, 1)
            Align: =Align.Center
            X: =Parent.Width * 3 / 4
            Y: =84
            Width: =Parent.Width / 4
            Height: =36
      # diferenças
      - lblCompDif:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With(
                  {
                      bip: Sum(Filter(ContagemDiaria, DataRef = lblCompData.Text), Faturadas + Insucessos + Resgates + MP),
                      j: ParseJSON(LookUp(IndicadoresSAP, Title = lblCompData.Text).Dados)
                  },
                  If(
                      IsBlank(j),
                      "SAP ainda não importado neste dia (salve ZEUENTREGO.csv e VBAP.XLSX na pasta Importacao SAP).",
                      "ZEUENTREGO " & If(Value(j.ordensZeu) - bip >= 0, "+", "") & Text(Value(j.ordensZeu) - bip, "#,##0", "pt-BR") & " vs bipadas   •   " &
                      "VBAP " & If(Value(j.ordensVbap) - Value(j.ordensZeu) >= 0, "+", "") & Text(Value(j.ordensVbap) - Value(j.ordensZeu), "#,##0", "pt-BR") & " vs ZEUENTREGO"
                  )
              )
            Size: =10
            Color: =RGBA(28, 43, 77, 1)
            Align: =Align.Center
            X: =0
            Y: =124
            Width: =Parent.Width
            Height: =34
      - lblCompNota:
          Control: Label@2.5.1
          Properties:
            Text: ="Simples remessa, resgates e trocas explicam parte da diferença."
            Size: =9
            Italic: =true
            Color: =RGBA(120, 130, 143, 1)
            Align: =Align.Center
            X: =0
            Y: =158
            Width: =Parent.Width
            Height: =30
