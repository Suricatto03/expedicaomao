- rectHeaderPai:
    Control: Rectangle@2.3.0
    Properties:
      Fill: =CorPrimaria
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =70
- icoVoltarPai:
    Control: Classic/Icon@2.5.0
    Properties:
      Icon: =Icon.ChevronLeft
      Color: =Color.White
      OnSelect: =Navigate(scrInicio, ScreenTransition.None)
      X: =6
      Y: =10
      Width: =50
      Height: =50
- lblTituloPai:
    Control: Label@2.5.1
    Properties:
      Text: |-
        ="Painel do Dia"
      Color: =Color.White
      Size: =18
      FontWeight: =FontWeight.Bold
      X: =60
      Y: =4
      Width: =Parent.Width - 70
      Height: =36
- lblAtualizadoPai:
    Control: Label@2.5.1
    Properties:
      Text: |-
        ="Atualizado às " & Text(varAtualizadoEm, "hh:mm:ss")
      Color: =Color.White
      Size: =11
      X: =60
      Y: =38
      Width: =Parent.Width - 70
      Height: =28
- dpData:
    Control: Classic/DatePicker@2.6.0
    Properties:
      DefaultDate: =Today()
      Format: |-
        ="dd/mm/yyyy"
      OnChange: =Select(btnAtualizar)
      Size: =13
      X: =X0
      Y: =78
      Width: =If(Largo, 300, Conteudo * 0.55)
      Height: =48
- btnAtualizar:
    Control: Classic/Button@2.2.0
    Properties:
      Text: |-
        ="ATUALIZAR"
      Fill: =CorEscura
      Color: =Color.White
      Size: =13
      FontWeight: =FontWeight.Bold
      X: =X0 + Conteudo - If(Largo, 200, Conteudo * 0.42)
      Y: =78
      Width: =If(Largo, 200, Conteudo * 0.42)
      Height: =48
      OnSelect: |-
        =With(
            {d: Text(dpData.SelectedDate, "yyyy-mm-dd")},
            ClearCollect(colContDia, Filter(ContagemDiaria, DataRef = d));
            Set(varResumo, LookUp(ResumoDiario, Title = d))
        );
        Set(varAtualizadoEm, Now())
- tmrAtualizar:
    Control: Timer@2.1.0
    Properties:
      Duration: =60000
      Repeat: =true
      AutoStart: =true
      Visible: =false
      OnTimerEnd: =Select(btnAtualizar)
      X: =0
      Y: =0
      Width: =10
      Height: =10
