- galPainel:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Items: |-
        =ForAll(
            colItinerarios As it,
            With(
                {c: LookUp(colContDia, Ordem = it.Ordem)},
                {
                    Ordem: it.Ordem,
                    Doca: it.Doca,
                    Itinerario: it.Itinerario,
                    Bairros: it.Bairros,
                    Codigo: it.CodigoItinerario,
                    Matricula: it.Matricula,
                    F: Coalesce(c.Faturadas, 0),
                    I: Coalesce(c.Insucessos, 0),
                    R: Coalesce(c.Resgates, 0),
                    M: Coalesce(c.MP, 0),
                    T: Coalesce(c.Total, 0)
                }
            )
        )
      TemplateSize: =If(Largo, 44, 48)
      TemplatePadding: =0
      Fill: =Color.White
      OnSelect: |-
        =Set(varLinhaDet, ThisItem);
        Set(varDetDataRef, Text(dpData.SelectedDate, "yyyy-mm-dd"));
        Navigate(scrDetalhe, ScreenTransition.None)
      X: =X0
      Y: =If(Largo, 254, 338)
      Width: =Conteudo
      Height: =Parent.Height - If(Largo, 254, 338) - 8
    Children:
      - lblPDoca:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.Doca
            FontWeight: =FontWeight.Bold
            Size: =If(Largo, 12, 10)
            Fill: =CorPrimaria
            Color: =Color.White
            Align: =Align.Center
            OnSelect: =Select(Parent)
            X: =0
            Y: =2
            Width: =ColDoca
            Height: =Parent.TemplateHeight - 4
      - lblPIt:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.Itinerario
            Size: =If(Largo, 12, 10)
            Align: =Align.Center
            OnSelect: =Select(Parent)
            X: =ColDoca
            Y: =0
            Width: =ColIt
            Height: =Parent.TemplateHeight
      - lblPBairro:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.Bairros
            Size: =If(Largo, 10, 8)
            OnSelect: =Select(Parent)
            X: =ColDoca + ColIt
            Y: =0
            Width: =Parent.TemplateWidth - ColDoca - ColIt - 5 * ColNum
            Height: =Parent.TemplateHeight
      - lblPF:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.F
            Size: =If(Largo, 12, 10)
            Align: =Align.Center
            OnSelect: =Select(Parent)
            X: =Parent.TemplateWidth - 5 * ColNum
            Y: =0
            Width: =ColNum
            Height: =Parent.TemplateHeight
      - lblPI:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.I
            Size: =If(Largo, 12, 10)
            Align: =Align.Center
            Fill: =RGBA(232, 245, 233, 1)
            OnSelect: =Select(Parent)
            X: =Parent.TemplateWidth - 4 * ColNum
            Y: =0
            Width: =ColNum
            Height: =Parent.TemplateHeight
      - lblPR:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.R
            Size: =If(Largo, 12, 10)
            Align: =Align.Center
            OnSelect: =Select(Parent)
            X: =Parent.TemplateWidth - 3 * ColNum
            Y: =0
            Width: =ColNum
            Height: =Parent.TemplateHeight
      - lblPM:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.M
            Size: =If(Largo, 12, 10)
            Align: =Align.Center
            OnSelect: =Select(Parent)
            X: =Parent.TemplateWidth - 2 * ColNum
            Y: =0
            Width: =ColNum
            Height: =Parent.TemplateHeight
      - lblPT:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.T
            Size: =If(Largo, 12, 10)
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            OnSelect: =Select(Parent)
            X: =Parent.TemplateWidth - 1 * ColNum
            Y: =0
            Width: =ColNum
            Height: =Parent.TemplateHeight
      - sepPainel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(220, 220, 220, 1)
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.TemplateWidth
            Height: =1
