Screens:
  scrConsulta:
    Properties:
      Fill: =CorFundo
      OnVisible: =SetFocus(txtBuscaNF)
    Children:
      - rectHeaderCons:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =CorPrimaria
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =110
      - icoVoltarCons:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            Color: =Color.White
            OnSelect: =Navigate(scrInicio, ScreenTransition.None)
            X: =15
            Y: =25
            Width: =60
            Height: =60
      - lblTituloCons:
          Control: Label@2.5.1
          Properties:
            Text: ="Consultar NF"
            Color: =Color.White
            Size: =22
            FontWeight: =FontWeight.Bold
            X: =85
            Y: =25
            Width: =540
            Height: =60

      - lblBuscaTit:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="Número da NF (com ou sem zeros) e série — ou bipe a chave:"
            Size: =13
            X: =30
            Y: =125
            Width: =580
            Height: =40
      - txtBuscaNF:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            HintText: |-
              ="Nº da NF  ex.: 10569344"
            Size: =16
            BorderColor: =CorEscura
            BorderThickness: =2
            OnChange: =Select(btnBuscar)
            X: =30
            Y: =165
            Width: =390
            Height: =70
      - txtBuscaSerie:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            HintText: ="Série"
            Size: =16
            BorderColor: =CorEscura
            BorderThickness: =2
            X: =430
            Y: =165
            Width: =180
            Height: =70
      - btnBuscar:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="BUSCAR"
            Fill: =CorPrimaria
            Color: =Color.White
            Size: =18
            FontWeight: =FontWeight.Bold
            X: =30
            Y: =250
            Width: =580
            Height: =70
            # Aceita "10569344", "010569344" ou a chave de 44 dígitos.
            # NumeroNF é gravado com 9 dígitos (zeros à esquerda) e Serie com 3.
            OnSelect: |-
              =With(
                  {t: Substitute(Trim(txtBuscaNF.Text), " ", ""), ts: Trim(txtBuscaSerie.Text)},
                  With(
                      {
                          n: If(Len(t) = 44, Mid(t, 26, 9), Right("000000000" & t, 9)),
                          s: If(Len(t) = 44, Mid(t, 23, 3), If(IsBlank(ts), "", Right("000" & ts, 3)))
                      },
                      If(
                          IsBlank(t),
                          Notify("Digite o número da NF.", NotificationType.Warning),
                          With(
                              {r: Filter(Bipagens, NumeroNF = n)},
                              ClearCollect(
                                  colConsulta,
                                  Sort(If(IsBlank(s), r, Filter(r, Serie = s)), Created, SortOrder.Descending)
                              )
                          );
                          Set(varBuscaTexto, "NF " & n & If(IsBlank(s), "", " / série " & s))
                      )
                  )
              )
      - lblResultadoCons:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(
                  IsBlank(varBuscaTexto), "",
                  CountRows(colConsulta) = 0, varBuscaTexto & ": nenhuma bipagem encontrada.",
                  varBuscaTexto & ": " & CountRows(colConsulta) & " registro(s)"
              )
            FontWeight: =FontWeight.Bold
            Size: =14
            X: =30
            Y: =330
            Width: =580
            Height: =45
      - galConsulta:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =colConsulta
            TemplateSize: =100
            TemplatePadding: =0
            Fill: =Color.White
            X: =30
            Y: =380
            Width: =580
            Height: =700
          Children:
            - rectConsCor:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =LookUp(Categorias, Cod = ThisItem.Categoria).Cor
                  X: =0
                  Y: =8
                  Width: =8
                  Height: =84
            - lblConsNF:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="NF " & ThisItem.NumeroNF & " / " & ThisItem.Serie & "  •  " & LookUp(Categorias, Cod = ThisItem.Categoria).Nome
                  FontWeight: =FontWeight.Bold
                  Size: =13
                  X: =18
                  Y: =4
                  Width: =550
                  Height: =32
            - lblConsOnde:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =Text(ThisItem.Created, "dd/mm/yyyy hh:mm") & "  •  Doca " & ThisItem.Doca & "  •  It. " & ThisItem.Itinerario & "  •  Mat. " & ThisItem.Matricula
                  Size: =11
                  X: =18
                  Y: =36
                  Width: =550
                  Height: =30
            - lblConsQuem:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Usuario
                  Size: =9
                  Color: =RGBA(110, 110, 110, 1)
                  X: =18
                  Y: =66
                  Width: =550
                  Height: =28
            - sepCons:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(220, 220, 220, 1)
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
